name: Gemini PDF 一键导出

on:
  workflow_dispatch:
    inputs:
      gemini_url:
        description: "在这里粘贴 Gemini 分享链接"
        required: true
        type: string

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest

    env:
      GEMINI_URL: ${{ inputs.gemini_url }}

    steps:
      - uses: actions/checkout@v4

      - name: 准备环境
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk poppler-utils
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: 导出 Gemini 对话
        run: |
          mkdir -p output

          node <<'NODE'
          const { chromium } = require("playwright");
          const fs = require("fs");

          function safeName(text) {
            let s = String(text || "Gemini对话")
              .replace(/[\\/:*?"<>|\u0000-\u001F]/g, "-")
              .replace(/\s+/g, " ")
              .trim();

            if (!s) s = "Gemini对话";

            return s.slice(0, 80);
          }

          function chinaTime() {
            const parts = new Intl.DateTimeFormat(
              "zh-CN",
              {
                timeZone: "Asia/Shanghai",
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
              }
            ).formatToParts(new Date());

            const p = Object.fromEntries(
              parts.map(x => [x.type, x.value])
            );

            return `${p.year}-${p.month}-${p.day}_${p.hour}-${p.minute}-${p.second}`;
          }

          (async () => {

            const browser = await chromium.launch({
              headless: true,
              args: [
                "--no-sandbox",
                "--disable-dev-shm-usage"
              ]
            });

            const page = await browser.newPage({
              viewport: {
                width: 1440,
                height: 1200
              }
            });

            console.log("① 打开 Gemini 分享链接");

            await page.goto(
              process.env.GEMINI_URL,
              {
                waitUntil: "domcontentloaded",
                timeout: 120000
              }
            );

            await page.waitForTimeout(5000);

            console.log(
              "实际地址:",
              page.url()
            );

            /*
             * 获取 Gemini 对话名称
             */
            let conversationTitle =
              await page.evaluate(() => {

                function clean(s) {
                  return String(s || "")
                    .replace(/\s+/g, " ")
                    .trim();
                }

                function usable(s) {
                  s = clean(s);

                  if (
                    s.length < 2 ||
                    s.length > 150
                  ) {
                    return false;
                  }

                  const bad = [
                    "Gemini",
                    "Google Gemini",
                    "Gemini - direct access to Google AI"
                  ];

                  return !bad.some(
                    x =>
                      x.toLowerCase() ===
                      s.toLowerCase()
                  );
                }

                const candidates = [

                  document
                    .querySelector(
                      'meta[property="og:title"]'
                    )
                    ?.content,

                  document
                    .querySelector(
                      'meta[name="twitter:title"]'
                    )
                    ?.content,

                  document
                    .querySelector("h1")
                    ?.textContent,

                  ...[
                    ...document.querySelectorAll(
                      '[class*="title" i]'
                    )
                  ]
                  .slice(0, 20)
                  .map(
                    x => x.textContent
                  )

                ];

                for (
                  const title of candidates
                ) {

                  if (usable(title)) {

                    return clean(title);

                  }

                }

                return null;

              });

            console.log("② 加载完整长对话");

            await page.evaluate(
              async () => {

                const sleep = ms =>
                  new Promise(
                    resolve =>
                      setTimeout(
                        resolve,
                        ms
                      )
                  );

                function getScrollables() {

                  return [

                    document.scrollingElement,

                    ...document
                      .querySelectorAll("*")

                  ]
                  .filter(Boolean)
                  .filter(el => {

                    try {

                      const style =
                        getComputedStyle(el);

                      return (
                        el.scrollHeight >
                          el.clientHeight +
                          100
                        &&
                        [
                          "auto",
                          "scroll"
                        ]
                        .includes(
                          style.overflowY
                        )
                      );

                    } catch {

                      return false;

                    }

                  });

                }

                for (
                  let round = 0;
                  round < 10;
                  round++
                ) {

                  const list =
                    getScrollables()
                      .sort(
                        (a, b) =>
                          b.scrollHeight -
                          a.scrollHeight
                      )
                      .slice(0, 20);

                  for (
                    const el of list
                  ) {

                    let max =
                      el.scrollHeight;

                    const step =
                      Math.max(
                        500,
                        Math.floor(
                          el.clientHeight *
                          0.7
                        )
                      );

                    for (
                      let y = 0;
                      y <= max;
                      y += step
                    ) {

                      el.scrollTop = y;

                      await sleep(80);

                      max =
                        Math.max(
                          max,
                          el.scrollHeight
                        );

                    }

                    el.scrollTop =
                      el.scrollHeight;

                    await sleep(150);

                  }

                  window.scrollTo(
                    0,
                    document
                      .documentElement
                      .scrollHeight
                  );

                  await sleep(400);

                }

                window.scrollTo(
                  0,
                  0
                );

              }
            );

            await page.waitForTimeout(
              2500
            );

            console.log(
              "③ 自动提取完整正文"
            );

            const result =
              await page.evaluate(() => {

                const total =
                  (
                    document.body
                      ?.innerText ||
                    ""
                  )
                  .trim()
                  .length;

                if (total < 1000) {

                  throw new Error(
                    "Gemini 页面没有正常加载"
                  );

                }

                const candidates = [
                  ...document
                    .querySelectorAll(
                      `
                      main,
                      article,
                      section,
                      div,
                      mat-sidenav-content,
                      bard-sidenav-container,
                      chat-window,
                      [role="main"]
                      `
                    )
                ];

                const viable =
                  candidates
                    .map(el => {

                      let depth = 0;
                      let p = el;

                      while (
                        p &&
                        p !== document.body
                      ) {

                        depth++;
                        p = p.parentElement;

                      }

                      return {

                        el,

                        chars:
                          (
                            el.innerText ||
                            ""
                          )
                          .trim()
                          .length,

                        depth

                      };

                    })
                    .filter(
                      x =>
                        x.chars >=
                        total * 0.65
                    );

                if (!viable.length) {

                  throw new Error(
                    "没有找到完整 Gemini 对话"
                  );

                }

                viable.sort(
                  (a, b) => {

                    if (
                      Math.abs(
                        a.chars -
                        b.chars
                      )
                      <
                      total * 0.05
                    ) {

                      return (
                        b.depth -
                        a.depth
                      );

                    }

                    return (
                      b.chars -
                      a.chars
                    );

                  }
                );

                const source =
                  viable[0].el;

                /*
                 * 保存图片真实地址
                 */
                source
                  .querySelectorAll(
                    "img"
                  )
                  .forEach(img => {

                    img.setAttribute(
                      "data-export-src",
                      img.currentSrc ||
                      img.src ||
                      ""
                    );

                  });

                const clone =
                  source.cloneNode(true);

                /*
                 * 去除网页按钮和导航
                 */
                clone
                  .querySelectorAll(
                    `
                    script,
                    style,
                    button,
                    input,
                    textarea,
                    nav,
                    header,
                    footer,
                    [role="button"],
                    [role="toolbar"],
                    [aria-hidden="true"]
                    `
                  )
                  .forEach(
                    el =>
                      el.remove()
                  );

                clone
                  .querySelectorAll(
                    "img"
                  )
                  .forEach(img => {

                    const src =
                      img.getAttribute(
                        "data-export-src"
                      );

                    if (src) {
                      img.src = src;
                    }

                    img.removeAttribute(
                      "loading"
                    );

                  });

                /*
                 * 取消 Gemini 的滚动限制
                 */
                [
                  clone,
                  ...clone
                    .querySelectorAll("*")
                ]
                .forEach(el => {

                  try {

                    el.style
                      .setProperty(
                        "max-height",
                        "none",
                        "important"
                      );

                    el.style
                      .setProperty(
                        "overflow",
                        "visible",
                        "important"
                      );

                    el.style
                      .setProperty(
                        "overflow-y",
                        "visible",
                        "important"
                      );

                    el.style
                      .setProperty(
                        "contain",
                        "none",
                        "important"
                      );

                    el.style
                      .setProperty(
                        "content-visibility",
                        "visible",
                        "important"
                      );

                    el.style
                      .setProperty(
                        "visibility",
                        "visible",
                        "important"
                      );

                    el.style
                      .setProperty(
                        "opacity",
                        "1",
                        "important"
                      );

                  } catch {}

                });

                clone.id =
                  "gemini-export-root";

                document.body
                  .replaceChildren(
                    clone
                  );

                const text =
                  (
                    clone.innerText ||
                    ""
                  )
                  .trim();

                return {

                  originalChars:
                    total,

                  exportedChars:
                    text.length,

                  images:
                    clone
                      .querySelectorAll(
                        "img"
                      )
                      .length,

                  firstLine:
                    text
                      .split("\n")
                      .map(
                        x => x.trim()
                      )
                      .find(
                        x =>
                          x.length >= 4 &&
                          x.length <= 100
                      )
                      || "Gemini对话"

                };

              });

            /*
             * 完整性检查
             */
            if (
              result.exportedChars <
              result.originalChars *
              0.70
              ||
              result.exportedChars <
              10000
            ) {

              throw new Error(
                "Gemini 对话提取不完整"
              );

            }

            /*
             * 如果页面没有拿到标题，
             * 使用正文第一行兜底
             */
            if (!conversationTitle) {

              conversationTitle =
                result.firstLine;

            }

            conversationTitle =
              safeName(
                conversationTitle
              );

            const time =
              chinaTime();

            const pdfName =
              `${conversationTitle}_${time}.pdf`;

            const pdfPath =
              `output/${pdfName}`;

            console.log(
              "对话名称:",
              conversationTitle
            );

            console.log(
              "最终 PDF:",
              pdfName
            );

            console.log(
              "④ 排版 PDF"
            );

            await page.addStyleTag({

              content: `

              @page {
                size: A4;
                margin:
                  15mm
                  14mm
                  18mm;
              }

              html,
              body {

                width:
                  auto !important;

                height:
                  auto !important;

                max-height:
                  none !important;

                overflow:
                  visible !important;

                background:
                  #ffffff !important;

                color:
                  #181818 !important;

              }

              body {
                margin:
                  0 !important;
              }

              #gemini-export-root {

                display:
                  block !important;

                width:
                  100% !important;

                max-width:
                  100% !important;

                height:
                  auto !important;

                max-height:
                  none !important;

                overflow:
                  visible !important;

                position:
                  static !important;

                transform:
                  none !important;

                font-family:
                  "Noto Sans CJK SC",
                  "Noto Sans SC",
                  sans-serif !important;

                font-size:
                  10.8pt !important;

                line-height:
                  1.68 !important;

              }

              #gemini-export-root * {

                max-width:
                  100%;

                box-sizing:
                  border-box;

              }

              #gemini-export-root img {

                display:
                  block !important;

                max-width:
                  100% !important;

                width:
                  auto !important;

                height:
                  auto !important;

                max-height:
                  230mm !important;

                object-fit:
                  contain !important;

                margin:
                  5mm auto !important;

                break-inside:
                  avoid !important;

              }

              #gemini-export-root p {

                margin-top:
                  0;

                margin-bottom:
                  3.5mm;

              }

              #gemini-export-root
              h1,
              #gemini-export-root
              h2,
              #gemini-export-root
              h3,
              #gemini-export-root
              h4 {

                line-height:
                  1.35;

                break-after:
                  avoid;

              }

              #gemini-export-root
              pre,
              #gemini-export-root
              code {

                white-space:
                  pre-wrap !important;

                overflow-wrap:
                  anywhere !important;

                word-break:
                  break-word !important;

              }

              #gemini-export-root
              table {

                width:
                  100% !important;

                max-width:
                  100% !important;

                table-layout:
                  fixed !important;

                border-collapse:
                  collapse !important;

              }

              #gemini-export-root
              th,
              #gemini-export-root
              td {

                word-break:
                  break-word !important;

                overflow-wrap:
                  anywhere !important;

              }

              `

            });

            try {

              await page.evaluate(
                async () => {

                  if (
                    document.fonts
                      ?.ready
                  ) {

                    await document
                      .fonts.ready;

                  }

                }
              );

            } catch {}

            await page.waitForTimeout(
              1200
            );

            console.log(
              "⑤ 生成 PDF"
            );

            await page.pdf({

              path:
                pdfPath,

              format:
                "A4",

              printBackground:
                true,

              preferCSSPageSize:
                true,

              displayHeaderFooter:
                false

            });

            fs.writeFileSync(

              "output/extraction-stats.json",

              JSON.stringify(
                {
                  conversationTitle,
                  pdfName,
                  originalChars:
                    result.originalChars,
                  exportedChars:
                    result.exportedChars,
                  images:
                    result.images,
                  exportTime:
                    time
                },
                null,
                2
              )

            );

            await browser.close();

            console.log(
              "✅ PDF 生成完成"
            );

          })()
          .catch(err => {

            console.error(err);

            process.exit(1);

          });

          NODE

      - name: 自动检查 PDF 是否完整
        run: |
          PDF=$(find output -maxdepth 1 -type f -name '*.pdf' | head -n 1)

          test -n "$PDF"

          PAGES=$(
            pdfinfo "$PDF" |
            awk '/Pages:/ {print $2}'
          )

          CHARS=$(
            pdftotext "$PDF" - |
            wc -m
          )

          echo "PDF 页数: $PAGES"
          echo "PDF 文字数: $CHARS"

          if [ "$PAGES" -lt 3 ]; then
            echo "PDF 页数异常"
            exit 1
          fi

          if [ "$CHARS" -lt 10000 ]; then
            echo "PDF 内容不完整"
            exit 1
          fi

          echo "✅ PDF 验收通过"

      - name: 提供 PDF 下载
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-PDF
          path: output/*.pdf
          if-no-files-found: error
