name: Export Gemini PDF V3

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/export.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk poppler-utils
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Export Gemini
        env:
          GEMINI_URL: "https://share.gemini.google/9r61Q6OHQeTG"

        run: |
          mkdir -p output

          node <<'NODE'
          const { chromium } = require("playwright");
          const fs = require("fs");

          (async () => {

            const browser = await chromium.launch({
              headless: true,
              args: [
                "--no-sandbox",
                "--disable-dev-shm-usage"
              ]
            });

            const page = await browser.newPage({
              viewport: {
                width: 1440,
                height: 1200
              }
            });

            console.log("① 打开 Gemini 分享页");

            await page.goto(
              process.env.GEMINI_URL,
              {
                waitUntil: "domcontentloaded",
                timeout: 120000
              }
            );

            await page.waitForTimeout(5000);

            console.log("最终 URL:", page.url());

            console.log("② 加载完整长对话");

            await page.evaluate(async () => {

              const sleep = ms =>
                new Promise(r => setTimeout(r, ms));

              function scrollables() {

                return [
                  document.scrollingElement,
                  ...document.querySelectorAll("*")
                ]
                .filter(Boolean)
                .filter(el => {

                  try {

                    const style =
                      getComputedStyle(el);

                    return (
                      el.scrollHeight >
                        el.clientHeight + 100 &&
                      [
                        "auto",
                        "scroll"
                      ].includes(
                        style.overflowY
                      )
                    );

                  } catch {

                    return false;

                  }

                });

              }

              for (
                let round = 0;
                round < 10;
                round++
              ) {

                const list =
                  scrollables()
                    .sort(
                      (a, b) =>
                        b.scrollHeight -
                        a.scrollHeight
                    )
                    .slice(0, 20);

                for (
                  const el of list
                ) {

                  let max =
                    el.scrollHeight;

                  const step =
                    Math.max(
                      500,
                      Math.floor(
                        el.clientHeight *
                        0.7
                      )
                    );

                  for (
                    let y = 0;
                    y <= max;
                    y += step
                  ) {

                    el.scrollTop = y;

                    await sleep(80);

                    max =
                      Math.max(
                        max,
                        el.scrollHeight
                      );

                  }

                  el.scrollTop =
                    el.scrollHeight;

                  await sleep(150);

                }

                window.scrollTo(
                  0,
                  document.documentElement
                    .scrollHeight
                );

                await sleep(400);

              }

              window.scrollTo(0, 0);

            });

            await page.waitForTimeout(2500);

            console.log("③ 等待图片加载");

            try {

              await page.waitForFunction(
                () =>
                  [...document.images]
                    .every(
                      img =>
                        img.complete
                    ),
                {
                  timeout: 30000
                }
              );

            } catch {}

            console.log(
              "④ 自动寻找完整对话正文"
            );

            const stats =
              await page.evaluate(() => {

                const bodyText =
                  (
                    document.body
                      ?.innerText || ""
                  ).trim();

                const totalChars =
                  bodyText.length;

                if (
                  totalChars < 1000
                ) {

                  throw new Error(
                    "Gemini 页面正文过短"
                  );

                }

                const candidates = [
                  ...document.querySelectorAll(
                    "main, article, section, div, " +
                    "mat-sidenav-content, " +
                    "bard-sidenav-container, " +
                    "chat-window, " +
                    "[role='main']"
                  )
                ];

                const viable =
                  candidates
                    .map(el => ({
                      el,
                      chars:
                        (
                          el.innerText ||
                          ""
                        ).trim().length,
                      depth:
                        (() => {
                          let d = 0;
                          let p = el;

                          while (
                            p &&
                            p !==
                              document.body
                          ) {
                            d++;
                            p =
                              p.parentElement;
                          }

                          return d;
                        })()
                    }))
                    .filter(x =>
                      x.chars >=
                      totalChars * 0.65
                    );

                if (!viable.length) {

                  throw new Error(
                    "没有找到完整正文容器"
                  );

                }

                /*
                  优先选择：
                  1. 包含至少 65% 页面文字
                  2. 层级尽量深
                  这样可以避开整个 app 外壳。
                */

                viable.sort(
                  (a, b) => {

                    if (
                      Math.abs(
                        a.chars -
                        b.chars
                      ) <
                      totalChars * 0.05
                    ) {

                      return (
                        b.depth -
                        a.depth
                      );

                    }

                    return (
                      b.chars -
                      a.chars
                    );

                  }
                );

                const source =
                  viable[0].el;

                const sourceChars =
                  (
                    source.innerText ||
                    ""
                  ).trim().length;

                console.log(
                  "正文候选字符数:",
                  sourceChars
                );

                /*
                  先记录真实图片 URL。
                */

                source
                  .querySelectorAll("img")
                  .forEach(
                    (img, index) => {

                      img.setAttribute(
                        "data-export-src",
                        img.currentSrc ||
                        img.src ||
                        ""
                      );

                    }
                  );

                const clone =
                  source.cloneNode(true);

                /*
                  去掉网页控制元素。
                */

                clone
                  .querySelectorAll(
                    `
                    script,
                    style,
                    button,
                    input,
                    textarea,
                    nav,
                    header,
                    footer,
                    [role="button"],
                    [role="toolbar"],
                    [aria-hidden="true"]
                    `
                  )
                  .forEach(
                    el => el.remove()
                  );

                /*
                  恢复图片真实地址。
                */

                clone
                  .querySelectorAll(
                    "img"
                  )
                  .forEach(img => {

                    const src =
                      img.getAttribute(
                        "data-export-src"
                      );

                    if (src) {
                      img.src = src;
                    }

                    img.removeAttribute(
                      "loading"
                    );

                  });

                /*
                  去掉 Gemini 页面原本用于
                  固定高度 / 虚拟滚动的布局限制。
                */

                [
                  clone,
                  ...clone.querySelectorAll(
                    "*"
                  )
                ]
                .forEach(el => {

                  try {

                    el.style
                      .setProperty(
                        "max-height",
                        "none",
                        "important"
                      );

                    el.style
                      .setProperty(
                        "overflow",
                        "visible",
                        "important"
                      );

                    el.style
                      .setProperty(
                        "overflow-y",
                        "visible",
                        "important"
                      );

                    el.style
                      .setProperty(
                        "contain",
                        "none",
                        "important"
                      );

                    el.style
                      .setProperty(
                        "content-visibility",
                        "visible",
                        "important"
                      );

                    el.style
                      .setProperty(
                        "visibility",
                        "visible",
                        "important"
                      );

                    el.style
                      .setProperty(
                        "opacity",
                        "1",
                        "important"
                      );

                  } catch {}

                });

                clone.id =
                  "gemini-export-root";

                /*
                  原页面全部清空，
                  只留下我们提取的正文。
                */

                document.body
                  .replaceChildren(clone);

                const finalChars =
                  (
                    clone.innerText ||
                    ""
                  ).trim().length;

                const images =
                  clone
                    .querySelectorAll(
                      "img"
                    ).length;

                return {

                  originalChars:
                    totalChars,

                  exportedChars:
                    finalChars,

                  sourceChars,

                  images

                };

              });

            console.log(
              "提取统计:",
              stats
            );

            /*
              要求至少保留原页面
              70% 的文字。
            */

            if (
              stats.exportedChars <
              stats.originalChars * 0.70
            ) {

              throw new Error(
                "正文提取比例不足"
              );

            }

            if (
              stats.exportedChars <
              10000
            ) {

              throw new Error(
                "提取文字不足 10000 字符"
              );

            }

            console.log(
              "⑤ 设置 PDF 排版"
            );

            await page.addStyleTag({
              content: `

              @page {

                size: A4;

                margin:
                  15mm
                  14mm
                  18mm;

              }

              html,
              body {

                width: auto !important;
                height: auto !important;

                max-height: none !important;

                overflow: visible !important;

                background:
                  #ffffff !important;

                color:
                  #181818 !important;

              }

              body {

                margin: 0 !important;

              }

              #gemini-export-root {

                display: block !important;

                width: 100% !important;

                max-width: 100% !important;

                height: auto !important;

                max-height: none !important;

                overflow: visible !important;

                position: static !important;

                transform:
                  none !important;

                font-family:
                  "Noto Sans CJK SC",
                  "Noto Sans SC",
                  "Microsoft YaHei",
                  sans-serif !important;

                font-size:
                  10.8pt !important;

                line-height:
                  1.68 !important;

              }

              #gemini-export-root * {

                max-width:
                  100%;

                box-sizing:
                  border-box;

              }

              #gemini-export-root
              img {

                display:
                  block !important;

                max-width:
                  100% !important;

                width:
                  auto !important;

                height:
                  auto !important;

                max-height:
                  230mm !important;

                object-fit:
                  contain !important;

                margin:
                  5mm auto !important;

                break-inside:
                  avoid !important;

              }

              #gemini-export-root
              p {

                margin-top: 0;

                margin-bottom:
                  3.5mm;

              }

              #gemini-export-root
              h1,
              #gemini-export-root
              h2,
              #gemini-export-root
              h3,
              #gemini-export-root
              h4 {

                line-height:
                  1.35;

                break-after:
                  avoid;

              }

              #gemini-export-root
              pre {

                white-space:
                  pre-wrap !important;

                overflow-wrap:
                  anywhere !important;

                word-break:
                  break-word !important;

                max-width:
                  100% !important;

              }

              #gemini-export-root
              code {

                white-space:
                  pre-wrap !important;

                overflow-wrap:
                  anywhere !important;

              }

              #gemini-export-root
              table {

                width:
                  100% !important;

                max-width:
                  100% !important;

                table-layout:
                  fixed !important;

                border-collapse:
                  collapse !important;

              }

              #gemini-export-root
              th,
              #gemini-export-root
              td {

                word-break:
                  break-word !important;

                overflow-wrap:
                  anywhere !important;

              }

              `
            });

            try {

              await page.evaluate(
                async () => {

                  if (
                    document.fonts
                      ?.ready
                  ) {

                    await document
                      .fonts.ready;

                  }

                }
              );

            } catch {}

            await page.waitForTimeout(
              1500
            );

            console.log(
              "⑥ 生成 PDF"
            );

            await page.pdf({

              path:
                "output/Gemini-conversation.pdf",

              format:
                "A4",

              printBackground:
                true,

              preferCSSPageSize:
                true,

              displayHeaderFooter:
                false

            });

            fs.writeFileSync(

              "output/extraction-stats.json",

              JSON.stringify(
                stats,
                null,
                2
              )

            );

            await browser.close();

            console.log(
              "PDF 已生成"
            );

          })()
          .catch(err => {

            console.error(err);

            process.exit(1);

          });

          NODE

      - name: Validate PDF
        run: |

          echo "===== PDF INFO ====="

          pdfinfo \
            output/Gemini-conversation.pdf

          PAGES=$(
            pdfinfo \
              output/Gemini-conversation.pdf |
            awk '/Pages:/ {print $2}'
          )

          CHARS=$(
            pdftotext \
              output/Gemini-conversation.pdf \
              - |
            wc -m
          )

          echo "PDF 页数: $PAGES"
          echo "PDF 文字数: $CHARS"

          if [ "$PAGES" -lt 3 ]; then

            echo \
              "PDF 页数异常"

            exit 1

          fi

          if [ "$CHARS" -lt 10000 ]; then

            echo \
              "PDF 文字量不足"

            exit 1

          fi

          echo \
            "PDF 严格验收通过"

      - name: Upload PDF
        uses: actions/upload-artifact@v4

        with:

          name:
            Gemini-PDF-V3

          path: |
            output/Gemini-conversation.pdf
            output/extraction-stats.json

      - name: Save PDF
        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            output/Gemini-conversation.pdf \
            output/extraction-stats.json

          git commit \
            -m \
            "Generate Gemini PDF V3" \
            || true

          git push
