name: Export Gemini PDF V2

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/export.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install browser and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk poppler-utils
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Extract Gemini conversation and create PDF
        env:
          GEMINI_URL: "https://share.gemini.google/9r61Q6OHQeTG"
        run: |
          mkdir -p output

          node <<'NODE'
          const { chromium } = require("playwright");
          const fs = require("fs");

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ["--no-sandbox", "--disable-dev-shm-usage"]
            });

            const page = await browser.newPage({
              viewport: { width: 1440, height: 1200 }
            });

            console.log("1. Opening Gemini...");
            await page.goto(process.env.GEMINI_URL, {
              waitUntil: "domcontentloaded",
              timeout: 120000
            });

            await page.waitForTimeout(5000);

            console.log("Final URL:", page.url());

            console.log("2. Loading complete conversation...");

            await page.evaluate(async () => {
              const sleep = ms =>
                new Promise(resolve => setTimeout(resolve, ms));

              const getScrollables = () =>
                [...document.querySelectorAll("*")].filter(el => {
                  try {
                    const cs = getComputedStyle(el);
                    return (
                      el.scrollHeight > el.clientHeight + 100 &&
                      ["auto", "scroll"].includes(cs.overflowY)
                    );
                  } catch {
                    return false;
                  }
                });

              for (let round = 0; round < 8; round++) {
                const scrollables = getScrollables()
                  .sort((a, b) => b.scrollHeight - a.scrollHeight)
                  .slice(0, 20);

                for (const el of scrollables) {
                  let max = el.scrollHeight;
                  const step = Math.max(
                    400,
                    Math.floor(el.clientHeight * 0.7)
                  );

                  for (let y = 0; y <= max; y += step) {
                    el.scrollTop = y;
                    await sleep(80);
                    max = Math.max(max, el.scrollHeight);
                  }

                  el.scrollTop = max;
                  await sleep(150);
                }

                window.scrollTo(
                  0,
                  document.documentElement.scrollHeight
                );

                await sleep(500);
              }

              window.scrollTo(0, 0);
            });

            await page.waitForTimeout(2500);

            console.log("3. Waiting for images...");

            try {
              await page.waitForFunction(
                () =>
                  [...document.images].every(
                    img => img.complete
                  ),
                { timeout: 30000 }
              );
            } catch {}

            console.log("4. Building clean conversation document...");

            const stats = await page.evaluate(() => {
              const containers = [
                ...document.querySelectorAll(
                  "div.conversation-container"
                )
              ];

              if (!containers.length) {
                throw new Error(
                  "No Gemini conversation containers found"
                );
              }

              const root = document.createElement("main");
              root.id = "pdf-root";

              let userCount = 0;
              let modelCount = 0;
              let imageCount = 0;

              containers.forEach((container, index) => {
                const exchange =
                  document.createElement("section");

                exchange.className = "pdf-exchange";

                // USER
                const userQuery =
                  container.querySelector("user-query");

                const queryText =
                  userQuery?.querySelector(".query-text");

                if (queryText) {
                  const userBlock =
                    document.createElement("section");

                  userBlock.className = "pdf-user";

                  const label =
                    document.createElement("div");

                  label.className = "pdf-role";
                  label.textContent = `你 · ${index + 1}`;

                  userBlock.appendChild(label);
                  userBlock.appendChild(
                    queryText.cloneNode(true)
                  );

                  // User-uploaded images that aren't inside query-text.
                  if (userQuery) {
                    userQuery
                      .querySelectorAll("img")
                      .forEach(img => {
                        if (!queryText.contains(img)) {
                          const cloned =
                            img.cloneNode(true);

                          cloned.loading = "eager";
                          userBlock.appendChild(cloned);
                        }
                      });
                  }

                  exchange.appendChild(userBlock);
                  userCount++;
                }

                // GEMINI
                const modelResponse =
                  container.querySelector(
                    "model-response"
                  );

                if (modelResponse) {
                  const regular =
                    modelResponse.querySelector(
                      ".model-response-text .markdown"
                    );

                  const extended =
                    modelResponse.querySelector(
                      "#extended-response-markdown-content"
                    );

                  const content =
                    extended || regular;

                  if (content) {
                    const modelBlock =
                      document.createElement("section");

                    modelBlock.className = "pdf-model";

                    const label =
                      document.createElement("div");

                    label.className = "pdf-role";
                    label.textContent = "Gemini";

                    modelBlock.appendChild(label);
                    modelBlock.appendChild(
                      content.cloneNode(true)
                    );

                    // Append images that Gemini puts outside the
                    // markdown element.
                    modelResponse
                      .querySelectorAll("img")
                      .forEach(img => {
                        if (!content.contains(img)) {
                          const cloned =
                            img.cloneNode(true);

                          cloned.loading = "eager";
                          modelBlock.appendChild(cloned);
                        }
                      });

                    exchange.appendChild(modelBlock);
                    modelCount++;
                  }
                }

                if (exchange.children.length) {
                  root.appendChild(exchange);
                }
              });

              imageCount =
                root.querySelectorAll("img").length;

              const textChars =
                (root.innerText || "").length;

              // Hide the original Gemini interface, but keep the
              // same document so its fonts/CSS/blob images remain alive.
              [...document.body.children].forEach(el => {
                el.style.setProperty(
                  "display",
                  "none",
                  "important"
                );
              });

              document.body.appendChild(root);

              return {
                conversationContainers: containers.length,
                userCount,
                modelCount,
                imageCount,
                textChars
              };
            });

            console.log("Extraction stats:", stats);

            if (stats.userCount === 0) {
              throw new Error(
                "No user messages were extracted"
              );
            }

            if (stats.modelCount === 0) {
              throw new Error(
                "No Gemini responses were extracted"
              );
            }

            if (stats.textChars < 10000) {
              throw new Error(
                `Extracted text too short: ${stats.textChars}`
              );
            }

            await page.addStyleTag({
              content: `
                @page {
                  size: A4;
                  margin: 15mm 14mm 18mm;
                }

                html,
                body {
                  background: #fff !important;
                  color: #171717 !important;
                  height: auto !important;
                  overflow: visible !important;
                }

                #pdf-root {
                  display: block !important;
                  width: 100% !important;
                  max-width: 100% !important;
                  overflow: visible !important;
                  font-family:
                    "Noto Sans CJK SC",
                    "Noto Sans SC",
                    "Microsoft YaHei",
                    sans-serif;
                  font-size: 11pt;
                  line-height: 1.68;
                }

                .pdf-exchange {
                  display: block;
                  margin: 0 0 12mm;
                  padding: 0 0 7mm;
                  border-bottom: 1px solid #e6e6e6;
                }

                .pdf-role {
                  font-size: 9pt;
                  font-weight: 700;
                  color: #666;
                  margin-bottom: 3mm;
                }

                .pdf-user {
                  display: block;
                  margin-bottom: 7mm;
                  padding: 4mm 5mm;
                  border-radius: 4mm;
                  background: #f3f4f6;
                }

                .pdf-model {
                  display: block;
                }

                #pdf-root h1,
                #pdf-root h2,
                #pdf-root h3,
                #pdf-root h4 {
                  line-height: 1.35;
                  break-after: avoid;
                }

                #pdf-root p {
                  margin-top: 0;
                  margin-bottom: 3.5mm;
                }

                #pdf-root ul,
                #pdf-root ol {
                  padding-left: 7mm;
                }

                #pdf-root img {
                  display: block !important;
                  max-width: 100% !important;
                  height: auto !important;
                  max-height: 230mm !important;
                  object-fit: contain !important;
                  margin: 5mm auto !important;
                  break-inside: avoid !important;
                  page-break-inside: avoid !important;
                }

                #pdf-root table {
                  width: 100% !important;
                  max-width: 100% !important;
                  border-collapse: collapse !important;
                  table-layout: fixed !important;
                  font-size: 9pt;
                }

                #pdf-root th,
                #pdf-root td {
                  overflow-wrap: anywhere !important;
                  word-break: break-word !important;
                }

                #pdf-root pre {
                  white-space: pre-wrap !important;
                  overflow-wrap: anywhere !important;
                  word-break: break-word !important;
                  max-width: 100% !important;
                }

                #pdf-root code {
                  white-space: pre-wrap !important;
                  overflow-wrap: anywhere !important;
                }

                #pdf-root button,
                #pdf-root script,
                #pdf-root style {
                  display: none !important;
                }
              `
            });

            try {
              await page.evaluate(async () => {
                if (document.fonts?.ready) {
                  await document.fonts.ready;
                }
              });
            } catch {}

            await page.waitForTimeout(1500);

            await page.pdf({
              path: "output/Gemini-conversation.pdf",
              format: "A4",
              printBackground: true,
              preferCSSPageSize: true,
              displayHeaderFooter: false
            });

            fs.writeFileSync(
              "output/extraction-stats.json",
              JSON.stringify(stats, null, 2)
            );

            await browser.close();

            console.log("PDF rendering completed.");
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Validate generated PDF
        run: |
          echo "=== PDF INFO ==="
          pdfinfo output/Gemini-conversation.pdf

          PAGES=$(
            pdfinfo output/Gemini-conversation.pdf |
            awk '/Pages:/ {print $2}'
          )

          TEXT_CHARS=$(
            pdftotext output/Gemini-conversation.pdf - |
            wc -m
          )

          echo "Validated PDF pages: $PAGES"
          echo "Validated PDF text characters: $TEXT_CHARS"

          if [ "$PAGES" -lt 2 ]; then
            echo "ERROR: PDF only has $PAGES page(s)"
            exit 1
          fi

          if [ "$TEXT_CHARS" -lt 10000 ]; then
            echo "ERROR: PDF text is incomplete"
            exit 1
          fi

          echo "PDF validation PASSED."

      - name: Upload validated PDF
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-PDF-Validated
          path: |
            output/Gemini-conversation.pdf
            output/extraction-stats.json

      - name: Save validated PDF into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            output/Gemini-conversation.pdf \
            output/extraction-stats.json

          git commit \
            -m "Generate validated Gemini PDF" || true

          git push
