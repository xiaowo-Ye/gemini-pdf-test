name: Gemini PDF 一键导出

on:
  workflow_dispatch:
    inputs:
      gemini_url:
        description: "在这里粘贴 Gemini 分享链接"
        required: true
        type: string

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest

    env:
      GEMINI_URL: ${{ inputs.gemini_url }}

    steps:
      - name: 准备环境
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk poppler-utils
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: 导出 Gemini 对话
        id: export
        run: |
          rm -rf output
          mkdir -p output

          node <<'NODE'
          const { chromium } = require("playwright");
          const fs = require("fs");

          function cleanText(text) {
            return String(text || "")
              .normalize("NFKC")
              .replace(
                /[\u200B-\u200F\u202A-\u202E\u2060-\u206F\uFEFF]/g,
                ""
              )
              .replace(/\s+/g, " ")
              .trim();
          }

          function safeName(text) {
            let s = cleanText(text)
              .replace(/[\\/:*?"<>|\u0000-\u001F]/g, "-")
              .replace(/\.+$/g, "")
              .trim();

            if (!s) s = "Gemini对话";

            return s.slice(0, 90);
          }

          function chinaTime() {
            const parts =
              new Intl.DateTimeFormat(
                "zh-CN",
                {
                  timeZone: "Asia/Shanghai",
                  year: "numeric",
                  month: "2-digit",
                  day: "2-digit",
                  hour: "2-digit",
                  minute: "2-digit",
                  second: "2-digit",
                  hour12: false
                }
              ).formatToParts(new Date());

            const p = Object.fromEntries(
              parts.map(x => [x.type, x.value])
            );

            return (
              `${p.year}-${p.month}-${p.day}_` +
              `${p.hour}-${p.minute}-${p.second}`
            );
          }

          function findRpcEntry(node) {
            if (!Array.isArray(node)) return null;

            if (
              node.length >= 3 &&
              node[0] === "wrb.fr" &&
              node[1] === "ujx1Bf"
            ) {
              return node;
            }

            for (const child of node) {
              const found = findRpcEntry(child);
              if (found) return found;
            }

            return null;
          }

          function parseRpcTitle(raw) {
            for (const line of raw.split("\n")) {
              const text = line.trim();

              if (!text.startsWith("[")) continue;

              try {
                const json = JSON.parse(text);
                const entry = findRpcEntry(json);

                if (
                  !entry ||
                  typeof entry[2] !== "string"
                ) {
                  continue;
                }

                const payload =
                  JSON.parse(entry[2]);

                const title =
                  payload?.[0]?.[2]?.[1];

                if (
                  typeof title === "string" &&
                  cleanText(title)
                ) {
                  return cleanText(title);
                }

              } catch {}
            }

            return null;
          }

          function isGenericGeminiTitle(title) {
            const t = cleanText(title).toLowerCase();

            return (
              !t ||
              t === "gemini" ||
              t === "google gemini" ||
              t.includes(
                "gemini - direct access to google ai"
              )
            );
          }

          (async () => {
            const browser =
              await chromium.launch({
                headless: true,
                args: [
                  "--no-sandbox",
                  "--disable-dev-shm-usage"
                ]
              });

            const page =
              await browser.newPage({
                viewport: {
                  width: 1440,
                  height: 1200
                }
              });

            console.log("① 打开 Gemini 分享链接");

            await page.goto(
              process.env.GEMINI_URL,
              {
                waitUntil: "domcontentloaded",
                timeout: 120000
              }
            );

            await page.waitForTimeout(5000);

            const finalUrl = page.url();

            console.log(
              "实际地址:",
              finalUrl
            );

            /*
             * 先从 Gemini 分享接口读取真正的对话名称
             */
            let conversationTitle = null;

            const shareMatch =
              finalUrl.match(
                /gemini\.google\.com\/share\/([^/?#]+)/
              );

            if (shareMatch) {
              const shareId =
                shareMatch[1];

              console.log(
                "② 读取 Gemini 对话名称"
              );

              try {
                const rawRpc =
                  await page.evaluate(
                    async shareId => {
                      const rpcId =
                        "ujx1Bf";

                      const inner =
                        JSON.stringify(
                          [
                            null,
                            shareId,
                            [4]
                          ]
                        );

                      const fReq =
                        JSON.stringify(
                          [[[
                            rpcId,
                            inner,
                            null,
                            "generic"
                          ]]]
                        );

                      const body =
                        new URLSearchParams({
                          "f.req": fReq
                        }).toString();

                      const response =
                        await fetch(
                          "/_/BardChatUi/data/" +
                          "batchexecute" +
                          "?rpcids=ujx1Bf&rt=c",
                          {
                            method: "POST",
                            headers: {
                              "content-type":
                                "application/" +
                                "x-www-form-urlencoded;" +
                                "charset=UTF-8"
                            },
                            body
                          }
                        );

                      return await response.text();
                    },
                    shareId
                  );

                conversationTitle =
                  parseRpcTitle(rawRpc);

              } catch (error) {
                console.log(
                  "接口标题读取失败，将使用页面标题备用方案"
                );
              }
            }

            /*
             * 如果接口标题没有拿到，
             * 再尝试从网页里寻找。
             */
            if (
              !conversationTitle ||
              isGenericGeminiTitle(
                conversationTitle
              )
            ) {
              conversationTitle =
                await page.evaluate(() => {
                  function clean(text) {
                    return String(text || "")
                      .normalize("NFKC")
                      .replace(
                        /[\u200B-\u200F\u202A-\u202E\u2060-\u206F\uFEFF]/g,
                        ""
                      )
                      .replace(/\s+/g, " ")
                      .trim();
                  }

                  function usable(text) {
                    const t =
                      clean(text);

                    const lower =
                      t.toLowerCase();

                    if (
                      t.length < 2 ||
                      t.length > 150
                    ) {
                      return false;
                    }

                    if (
                      lower === "gemini" ||
                      lower === "google gemini" ||
                      lower.includes(
                        "gemini - direct access to google ai"
                      )
                    ) {
                      return false;
                    }

                    return true;
                  }

                  const candidates = [
                    document
                      .querySelector(
                        'meta[property="og:title"]'
                      )
                      ?.content,

                    document
                      .querySelector(
                        'meta[name="twitter:title"]'
                      )
                      ?.content,

                    document
                      .querySelector("h1")
                      ?.textContent,

                    ...[
                      ...document
                        .querySelectorAll(
                          '[class*="title" i]'
                        )
                    ]
                    .slice(0, 30)
                    .map(
                      el =>
                        el.textContent
                    )
                  ];

                  for (
                    const candidate of candidates
                  ) {
                    if (usable(candidate)) {
                      return clean(candidate);
                    }
                  }

                  return null;
                });
            }

            console.log(
              "③ 加载完整长对话"
            );

            await page.evaluate(
              async () => {
                const sleep = ms =>
                  new Promise(
                    resolve =>
                      setTimeout(resolve, ms)
                  );

                function scrollables() {
                  return [
                    document.scrollingElement,
                    ...document
                      .querySelectorAll("*")
                  ]
                  .filter(Boolean)
                  .filter(el => {
                    try {
                      const style =
                        getComputedStyle(el);

                      return (
                        el.scrollHeight >
                          el.clientHeight +
                          100 &&
                        [
                          "auto",
                          "scroll"
                        ].includes(
                          style.overflowY
                        )
                      );
                    } catch {
                      return false;
                    }
                  });
                }

                for (
                  let round = 0;
                  round < 10;
                  round++
                ) {
                  const list =
                    scrollables()
                      .sort(
                        (a, b) =>
                          b.scrollHeight -
                          a.scrollHeight
                      )
                      .slice(0, 20);

                  for (const el of list) {
                    let max =
                      el.scrollHeight;

                    const step =
                      Math.max(
                        500,
                        Math.floor(
                          el.clientHeight *
                          0.7
                        )
                      );

                    for (
                      let y = 0;
                      y <= max;
                      y += step
                    ) {
                      el.scrollTop = y;

                      await sleep(80);

                      max =
                        Math.max(
                          max,
                          el.scrollHeight
                        );
                    }

                    el.scrollTop =
                      el.scrollHeight;

                    await sleep(150);
                  }

                  window.scrollTo(
                    0,
                    document
                      .documentElement
                      .scrollHeight
                  );

                  await sleep(400);
                }

                window.scrollTo(0, 0);
              }
            );

            await page.waitForTimeout(2000);

            console.log(
              "④ 提取完整对话正文"
            );

            const result =
              await page.evaluate(() => {
                const total =
                  (
                    document.body
                      ?.innerText ||
                    ""
                  )
                  .trim()
                  .length;

                if (total < 50) {
                  throw new Error(
                    "Gemini 页面没有正常加载"
                  );
                }

                const candidates = [
                  ...document
                    .querySelectorAll(
                      `
                      main,
                      article,
                      section,
                      div,
                      mat-sidenav-content,
                      bard-sidenav-container,
                      chat-window,
                      [role="main"]
                      `
                    )
                ]
                .map(el => {
                  let depth = 0;
                  let p = el;

                  while (
                    p &&
                    p !== document.body
                  ) {
                    depth++;
                    p = p.parentElement;
                  }

                  return {
                    el,
                    chars:
                      (
                        el.innerText ||
                        ""
                      )
                      .trim()
                      .length,
                    depth
                  };
                })
                .filter(
                  x => x.chars > 0
                );

                if (!candidates.length) {
                  throw new Error(
                    "没有找到 Gemini 正文"
                  );
                }

                const maxChars =
                  Math.max(
                    ...candidates.map(
                      x => x.chars
                    )
                  );

                const nearMax =
                  candidates.filter(
                    x =>
                      x.chars >=
                      maxChars * 0.90
                  );

                nearMax.sort(
                  (a, b) =>
                    b.depth - a.depth
                );

                const source =
                  nearMax[0].el;

                source
                  .querySelectorAll("img")
                  .forEach(img => {
                    img.setAttribute(
                      "data-export-src",
                      img.currentSrc ||
                      img.src ||
                      ""
                    );
                  });

                const clone =
                  source.cloneNode(true);

                                clone
                  .querySelectorAll(
                    `
                    script,
                    style,
                    input,
                    textarea,
                    nav,
                    header,
                    footer,
                    [role="toolbar"]
                    `
                  )
                  .forEach(
                    el => el.remove()
                  );

                /*
                 * 图片保留修复
                 */
                [
                  ...clone.querySelectorAll(
                    `
                    button,
                    [role="button"],
                    [aria-hidden="true"]
                    `
                  )
                ]
                .forEach(el => {

                  const hasVisual =
                    !!el.querySelector(
                      "img, picture, canvas, svg"
                    );

                  const text =
                    (
                      el.innerText ||
                      el.textContent ||
                      ""
                    )
                    .replace(/\s+/g, " ")
                    .trim();

                  if (
                    hasVisual ||
                    text.length >= 4
                  ) {

                    el.replaceWith(
                      ...el.childNodes
                    );

                  } else {

                    el.remove();

                  }

                });

                clone
                  .querySelectorAll("img")
                  .forEach(img => {
                    const src =
                      img.getAttribute(
                        "data-export-src"
                      );

                    if (src) {
                      img.src = src;
                    }

                    img.removeAttribute(
                      "loading"
                    );
                  });

                [
                  clone,
                  ...clone
                    .querySelectorAll("*")
                ]
                .forEach(el => {
                  try {
                    el.style.setProperty(
                      "max-height",
                      "none",
                      "important"
                    );

                    el.style.setProperty(
                      "overflow",
                      "visible",
                      "important"
                    );

                    el.style.setProperty(
                      "overflow-y",
                      "visible",
                      "important"
                    );

                    el.style.setProperty(
                      "contain",
                      "none",
                      "important"
                    );

                    el.style.setProperty(
                      "content-visibility",
                      "visible",
                      "important"
                    );

                    el.style.setProperty(
                      "visibility",
                      "visible",
                      "important"
                    );

                    el.style.setProperty(
                      "opacity",
                      "1",
                      "important"
                    );
                  } catch {}
                });

                clone.id =
                  "gemini-export-root";

                document.body
                  .replaceChildren(clone);

                const text =
                  (
                    clone.innerText ||
                    ""
                  ).trim();

                return {
                  pageChars: total,
                  exportedChars:
                    text.length,
                  images:
                    clone
                      .querySelectorAll("img")
                      .length
                };
              });

            if (
              result.exportedChars < 20
            ) {
              throw new Error(
                "没有提取到有效对话内容"
              );
            }

            if (
              !conversationTitle ||
              isGenericGeminiTitle(
                conversationTitle
              )
            ) {
              conversationTitle =
                "Gemini对话";
            }

            conversationTitle =
              safeName(
                conversationTitle
              );

            const exportTime =
              chinaTime();

            const pdfName =
              `${conversationTitle}_${exportTime}.pdf`;

            const pdfPath =
              `output/${pdfName}`;

            console.log(
              "真实对话名称:",
              conversationTitle
            );

            console.log(
              "最终 PDF 文件名:",
              pdfName
            );

            console.log(
              "⑤ 设置 PDF 排版"
            );

            await page.addStyleTag({
              content: `
                @page {
                  size: A4;
                  margin:
                    15mm 14mm 18mm;
                }

                html,
                body {
                  width: auto !important;
                  height: auto !important;
                  max-height: none !important;
                  overflow: visible !important;
                  background: #fff !important;
                  color: #181818 !important;
                }

                body {
                  margin: 0 !important;
                }

                #gemini-export-root {
                  display: block !important;
                  width: 100% !important;
                  max-width: 100% !important;
                  height: auto !important;
                  max-height: none !important;
                  overflow: visible !important;
                  position: static !important;
                  transform: none !important;

                  font-family:
                    "Noto Sans CJK SC",
                    "Noto Sans SC",
                    sans-serif !important;

                  font-size: 10.8pt !important;
                  line-height: 1.68 !important;
                }

                #gemini-export-root * {
                  max-width: 100%;
                  box-sizing: border-box;
                }

                #gemini-export-root img {
                  display: block !important;
                  max-width: 100% !important;
                  width: auto !important;
                  height: auto !important;
                  max-height: 230mm !important;
                  object-fit: contain !important;
                  margin: 5mm auto !important;
                  break-inside: avoid !important;
                }

                #gemini-export-root p {
                  margin-top: 0;
                  margin-bottom: 3.5mm;
                }

                #gemini-export-root
                h1,
                #gemini-export-root
                h2,
                #gemini-export-root
                h3,
                #gemini-export-root
                h4 {
                  line-height: 1.35;
                  break-after: avoid;
                }

                #gemini-export-root
                pre,
                #gemini-export-root
                code {
                  white-space:
                    pre-wrap !important;
                  overflow-wrap:
                    anywhere !important;
                  word-break:
                    break-word !important;
                }

                #gemini-export-root
                table {
                  width: 100% !important;
                  max-width: 100% !important;
                  table-layout:
                    fixed !important;
                  border-collapse:
                    collapse !important;
                }

                #gemini-export-root
                th,
                #gemini-export-root
                td {
                  word-break:
                    break-word !important;
                  overflow-wrap:
                    anywhere !important;
                }
              `
            });

            try {
              await page.evaluate(
                async () => {
                  if (
                    document.fonts
                      ?.ready
                  ) {
                    await document
                      .fonts.ready;
                  }
                }
              );
            } catch {}

            await page.waitForTimeout(1200);

            console.log(
              "⑥ 生成 PDF"
            );

            await page.pdf({
              path: pdfPath,
              format: "A4",
              printBackground: true,
              preferCSSPageSize: true,
              displayHeaderFooter: false
            });

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `pdf_path=${pdfPath}\n`
            );

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `expected_chars=${result.exportedChars}\n`
            );

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `pdf_name=${pdfName}\n`
            );

            await browser.close();

            console.log(
              "✅ PDF 生成完成"
            );
          })()
          .catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: 自动检查 PDF 是否完整
        env:
          PDF_PATH: ${{ steps.export.outputs.pdf_path }}
          EXPECTED_CHARS: ${{ steps.export.outputs.expected_chars }}
        run: |
          test -f "$PDF_PATH"

          PAGES=$(
            pdfinfo "$PDF_PATH" |
            awk '/Pages:/ {print $2}'
          )

          PDF_CHARS=$(
            pdftotext "$PDF_PATH" - |
            wc -m
          )

          MIN_CHARS=$(( EXPECTED_CHARS * 65 / 100 ))

          echo "PDF 页数: $PAGES"
          echo "原始正文文字量: $EXPECTED_CHARS"
          echo "PDF 可读取文字量: $PDF_CHARS"

          if [ "$PAGES" -lt 1 ]; then
            echo "PDF 没有有效页面"
            exit 1
          fi

          if [ "$PDF_CHARS" -lt "$MIN_CHARS" ]; then
            echo "PDF 内容疑似不完整"
            exit 1
          fi

          echo "✅ PDF 自动验收通过"

      - name: 提供 PDF 下载
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-PDF
          path: ${{ steps.export.outputs.pdf_path }}
          if-no-files-found: error
